name: Assessment CLI regression tests
on:
  push:
  pull_request:
jobs:
  assessment-cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline dispatcher and exit-status regression tests
        run: python -m unittest discover -s tests -p "test_assessment_cli.py" -v
